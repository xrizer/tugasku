name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"

      - name: Save APK to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lifehack-android-apk-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Authenticate to Google Drive
        id: gdrive_auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.file

      - name: Upload APK to Google Drive
        env:
          ACCESS_TOKEN: ${{ steps.gdrive_auth.outputs.access_token }}
          GOOGLE_DRIVE_FOLDER_ID: '13naZpSUJQ37D3n429NxZWLDrvELPfzBk'
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ -z "$ACCESS_TOKEN" ]]; then
            echo 'Missing access token from google-github-actions/auth — check GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON.' >&2
            exit 1
          fi

          metadata=$(printf '{"name":"lifehack-%s.apk","parents":["%s"]}' "$RUN_NUMBER" "$GOOGLE_DRIVE_FOLDER_ID")
          apk_path='build/app/outputs/flutter-apk/app-release.apk'
          boundary="boundary_$(date +%s%N)"
          request_body=$(mktemp)
          {
            printf -- '--%s\r\n' "$boundary"
            printf 'Content-Type: application/json; charset=UTF-8\r\n\r\n'
            printf '%s\r\n' "$metadata"
            printf -- '--%s\r\n' "$boundary"
            printf 'Content-Type: application/vnd.android.package-archive\r\n\r\n'
            cat "$apk_path"
            printf '\r\n--%s--\r\n' "$boundary"
          } > "$request_body"

          response_body=$(mktemp)
          http_code=$(curl --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            --header "Content-Type: multipart/related; boundary=$boundary" \
            --data-binary "@$request_body" \
            --output "$response_body" \
            --write-out '%{http_code}' \
            'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink')
          rm -f "$request_body"

          echo "Google Drive API responded with HTTP $http_code"
          cat "$response_body"
          echo

          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            rm -f "$response_body"
            exit 1
          fi
          rm -f "$response_body"
