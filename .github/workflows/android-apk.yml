name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"

      - name: Save APK to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lifehack-android-apk-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - id: google-auth
        name: Authenticate with Google Drive
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.file

      - name: Upload APK to Google Drive
        env:
          ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          GOOGLE_DRIVE_FOLDER_ID: '13naZpSUJQ37D3n429NxZWLDrvELPfzBk'
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          metadata=$(printf '{"name":"lifehack-%s.apk","parents":["%s"]}' "$RUN_NUMBER" "$GOOGLE_DRIVE_FOLDER_ID")
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            --form "metadata=$metadata;type=application/json;charset=UTF-8" \
            --form "file=@build/app/outputs/flutter-apk/app-release.apk;type=application/vnd.android.package-archive" \
            'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink'
